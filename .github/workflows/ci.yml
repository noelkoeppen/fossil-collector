name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Modell-Ableitungen pruefen (tools/models3d)
        run: |
          python -m pip install --quiet numpy scipy pillow
          python -m unittest discover -s tools/models3d -p 'test_*.py' -v
          python tools/models3d/neighbors.py --check
          python tools/models3d/bone_images.py --check

      - name: Core-Tests
        run: ./gradlew :core:test --stacktrace

      - name: App-Unit-Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Debug-APK bauen
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v6
        with:
          name: fossil-collector-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
