name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v5

      - name: Datenvalidierung (JSON-Schemas)
        run: |
          python3 -m pip install --quiet jsonschema
          python3 tools/validate_data.py

      - name: Core-Tests
        run: ./gradlew :core:test --stacktrace

      - name: Debug-APK bauen
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: core-test-reports
          path: core/build/reports/tests/

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v6
        with:
          name: fossil-collector-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
